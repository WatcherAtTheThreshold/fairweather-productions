<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Standard Favicons -->
<link rel="icon" href="images/quill_favicon.ico" type="image/x-icon" />
<link rel="icon" href="images/quill_32x32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="images/quill_64x64.png" sizes="64x64" type="image/png" />
<link rel="icon" href="images/quill_128x128.png" sizes="128x128" type="image/png" />

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" href="images/quill_apple_touch_180x180.png" />


  <title>Gallery - The Gentle Machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;700&family=Source+Sans+Pro:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Source Sans Pro', sans-serif;
      background-color: #1a1f2e;
      color: #e8e6e1;
      overflow-x: hidden;
      position: relative;
    }

    .background {
      background: rgba(26, 31, 46, 0.6);
      opacity: 1;
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -4;
    }

    .mist-overlay {
      background: url('images/mist-overlay.png') repeat;
      position: fixed;
      width: 100%;
      height: 500vh;
      top: 0;
      left: 0;
      filter: hue-rotate(200deg) saturate(0.3);
    }

    .mist-overlay-1 {
      opacity: 0.65;
      z-index: -3;
      animation: mistDrift1 140s linear infinite;
    }

    .mist-overlay-2 {
      opacity: 0.45;
      z-index: -2;
      animation: mistDrift2 100s linear infinite;
    }

    .mist-overlay-3 {
      opacity: 0.25;
      z-index: -1;
      animation: mistDrift3 80s linear infinite;
    }

    @keyframes mistDrift1 {
      from { background-position: 0 0; }
      to { background-position: -600px 400px; }
    }

    @keyframes mistDrift2 {
      from { background-position: -200px 100px; }
      to { background-position: 300px -500px; }
    }

    @keyframes mistDrift3 {
      from { background-position: 100px -50px; }
      to { background-position: -400px 600px; }
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
    }

    .particle.mist {
      background: radial-gradient(circle, rgba(160, 175, 195, 0.5) 0%, rgba(160, 175, 195, 0.1) 70%, transparent 100%);
    }

    .particle.steel {
      background: radial-gradient(circle, rgba(100, 140, 180, 0.4) 0%, rgba(100, 140, 180, 0.1) 70%, transparent 100%);
    }

    .particle.dust {
      background: radial-gradient(circle, rgba(180, 175, 165, 0.35) 0%, rgba(180, 175, 165, 0.08) 70%, transparent 100%);
    }

    @keyframes floatGentle {
      0% {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: var(--peak-opacity, 0.4);
      }
      90% {
        opacity: var(--peak-opacity, 0.4);
      }
      100% {
        transform: translateY(-10vh) translateX(var(--drift, 30px));
        opacity: 0;
      }
    }

    .header {
      text-align: center;
      padding: 3rem 2rem 2rem;
      backdrop-filter: blur(5px);
      background: rgba(26, 31, 46, 0.3);
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.5rem;
      font-weight: 500;
      color: #e8e6e1;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 1.2rem;
      color: rgba(200, 196, 188, 0.7);
      font-weight: 300;
      font-style: italic;
    }

    .mobile-menu-button {
      display: none;
      background: rgba(30, 36, 52, 0.5);
      backdrop-filter: blur(10px);
      color: #e8e6e1;
      border: 1px solid rgba(120, 130, 150, 0.25);
      padding: 1rem;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.25s ease;
      margin: 0 auto 1rem;
      width: fit-content;
    }

    .mobile-menu-button:hover {
      background: rgba(100, 140, 180, 0.1);
      border-color: rgba(140, 160, 185, 0.4);
      transform: translateY(-2px);
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 700px;
      margin: 2rem auto;
      padding: 0 2rem;
      position: relative;
      z-index: 1;
    }

    .nav-links {
      display: contents;
    }

    .cruxfade-link {
      font-size: 1.3rem;
      color: rgba(200, 196, 188, 0.7) !important;
      text-decoration: none;
      transition: all 0.25s ease;
      padding: 0.5rem 1rem !important;
      border: 1px solid rgba(120, 130, 150, 0.3) !important;
      border-radius: 8px;
      backdrop-filter: blur(5px);
      background: transparent !important;
      box-shadow: none !important;
      transform: none !important;
      height: 60px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .cruxfade-link:hover {
      color: #e8e6e1 !important;
      border-color: rgba(140, 160, 185, 0.5) !important;
      background: rgba(100, 140, 180, 0.1) !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2) !important;
    }

    .nav a {
      background: rgba(100, 140, 180, 0.15);
      backdrop-filter: blur(10px);
      color: #e8e6e1;
      text-decoration: none;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 400;
      transition: all 0.25s ease;
      border: 1px solid rgba(100, 140, 180, 0.5);
      text-align: center;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .nav a::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      transition: left 0.5s;
    }

    .nav a:hover::before {
      left: 100%;
    }

    .nav a:hover {
      background: rgba(100, 140, 180, 0.1);
      border-color: rgba(140, 160, 185, 0.4);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .nav a.creative {
      border-color: rgba(100, 140, 180, 0.35);
    }

    .nav a.creative:hover {
      border-color: rgba(120, 160, 200, 0.6);
      background: rgba(100, 140, 180, 0.1);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .nav a.current {
      background: rgba(26, 31, 46, 0.4);
      border-color: rgba(120, 130, 150, 0.25);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Card flip wrapper */
    .image-card {
      perspective: 1200px;
      cursor: pointer;
      transform: translateY(20px);
      opacity: 0;
      animation: fadeInUp 0.6s ease forwards;
    }

    .image-card:nth-child(2n) { animation-delay: 0.08s; }
    .image-card:nth-child(3n) { animation-delay: 0.12s; }
    .image-card:nth-child(4n) { animation-delay: 0.16s; }

    @keyframes fadeInUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .card-inner {
      position: relative;
      width: 100%;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.4, 0.0, 0.2, 1);
      border-radius: 12px;
    }

    .image-card.flipping .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      backface-visibility: hidden;
      border-radius: 12px;
      overflow: hidden;
    }

    .card-front {
      background: rgba(30, 36, 52, 0.65);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(120, 130, 150, 0.15);
      position: relative;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card-front::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(100, 140, 180, 0.4), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 2;
    }

    .image-card:hover .card-front::before {
      opacity: 1;
    }

    .image-card:hover .card-front {
      border-color: rgba(140, 160, 185, 0.4);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .card-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotateY(180deg);
      background: rgba(30, 36, 52, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 140, 180, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-back-inner {
      text-align: center;
      padding: 1.5rem;
      color: rgba(200, 196, 188, 0.7);
      font-size: 0.95rem;
      font-style: italic;
    }

    .image-container {
      aspect-ratio: 4 / 3;
      overflow: hidden;
    }

    .image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease, opacity 0.5s ease;
      opacity: 0;
    }

    .image-card img.loaded {
      opacity: 1;
    }

    .image-card:hover img {
      transform: scale(1.04);
    }

    .caption {
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      color: rgba(200, 196, 188, 0.85);
      text-align: center;
      background: rgba(26, 31, 46, 0.3);
    }

    /* Lightbox overlay */
    .lightbox-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2000;
      background: rgba(20, 25, 38, 0);
      backdrop-filter: blur(0px);
      transition: background 0.7s cubic-bezier(0.4, 0.0, 0.2, 1), backdrop-filter 0.7s cubic-bezier(0.4, 0.0, 0.2, 1);
    }

    .lightbox-overlay.active {
      background: rgba(20, 25, 38, 0.95);
      backdrop-filter: blur(20px);
    }

    /* The expanding card clone */
    .lightbox-card {
      position: fixed;
      z-index: 2001;
      border-radius: 12px;
      overflow: hidden;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      transition: top 0.8s cubic-bezier(0.4, 0.0, 0.2, 1),
                  left 0.8s cubic-bezier(0.4, 0.0, 0.2, 1),
                  width 0.8s cubic-bezier(0.4, 0.0, 0.2, 1),
                  height 0.8s cubic-bezier(0.4, 0.0, 0.2, 1),
                  border-radius 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
    }

    .lightbox-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: rgba(20, 25, 38, 1);
      border-radius: 8px;
    }

    .lightbox-card.expanded {
      border-radius: 8px;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 35px;
      width: 50px;
      height: 50px;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(30, 36, 52, 0.6);
      backdrop-filter: blur(10px);
      color: #e8e6e1;
      font-size: 28px;
      border: 1px solid rgba(120, 130, 150, 0.25);
      border-radius: 50%;
      cursor: pointer;
      z-index: 2002;
      transition: all 0.25s ease;
      line-height: 1;
      opacity: 0;
    }

    .lightbox-close.visible {
      display: flex;
      opacity: 1;
      transition: opacity 0.4s ease 0.4s;
    }

    .lightbox-close:hover {
      color: rgba(140, 175, 210, 0.9);
      background: rgba(100, 140, 180, 0.1);
      border-color: rgba(100, 140, 180, 0.4);
      transform: scale(1.1);
    }

    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(26, 31, 46, 0.6);
      backdrop-filter: blur(10px);
      color: #e8e6e1;
      border: 1px solid rgba(120, 130, 150, 0.25);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .back-to-top:hover {
      background: rgba(100, 140, 180, 0.1);
      border-color: rgba(140, 160, 185, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .back-to-top.show {
      display: flex;
    }

    footer {
      text-align: center;
      padding: 3rem 2rem;
      font-size: 0.9rem;
      color: rgba(200, 196, 188, 0.5);
      font-family: 'Source Sans Pro', sans-serif;
      backdrop-filter: blur(5px);
      background: rgba(26, 31, 46, 0.3);
      margin-top: 2rem;
      position: relative;
      z-index: 1;
    }

    footer a {
      color: rgba(100, 140, 180, 0.6);
      text-decoration: none;
      transition: color 0.25s ease;
    }

    footer a:hover {
      color: rgba(140, 175, 210, 0.8);
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }

      .mobile-menu-button {
        display: block;
      }

      .nav {
        grid-template-columns: 1fr;
        gap: 0.8rem;
        max-height: 60vh;
        overflow-y: auto;
        max-width: 400px;
      }

      .nav-links {
        display: none;
        grid-template-columns: 1fr;
        gap: 0.8rem;
      }

      .nav-links.open {
        display: grid;
        animation: slideDown 0.3s ease;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .nav a {
        padding: 0.8rem 1rem;
        font-size: 0.9rem;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 1.5rem;
        padding: 1rem;
      }

      .header {
        padding: 2rem 1rem 1rem;
      }
    }

    @media (max-width: 480px) {
      .nav {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="mist-overlay mist-overlay-1"></div>
  <div class="mist-overlay mist-overlay-2"></div>
  <div class="mist-overlay mist-overlay-3"></div>
  <div class="particles" id="particles"></div>

  <div class="header">
    <h1>Gallery</h1>
    <p class="subtitle">Visual explorations from the threshold</p>
  </div>

  <div class="nav">
    <button class="mobile-menu-button" id="mobileMenuButton">☰ Menu</button>
    <div class="nav-links" id="navLinks">
      <a href="./index.html">Home</a>
      <a href="./gallery.html" class="current">Gallery</a>
      <a href="./games.html" class="creative">Games</a>
      <a href="./music.html" class="creative">Music</a>
      <a href="./writing.html">Writing</a>
      <a href="./about.html">About</a>
      <a href="./contact.html">Contact</a>
      <a href="https://watcheratthethreshold.github.io/shadows-of-the-deck/" class="cruxfade-link" title="Enter Cruxfade">⟁ Shadows</a>

  </div>

  <div class="gallery" id="gallery"></div>

  <!-- Lightbox overlay -->
  <div id="lightboxOverlay" class="lightbox-overlay" onclick="closeLightbox()"></div>
  <span id="lightboxClose" class="lightbox-close" onclick="closeLightbox()">&times;</span>

  <button class="back-to-top" id="scrollTop" title="Back to top">↑</button>

  <footer>
    © 2025 The Gentle Machine | In collaboration with <a href="../second-gaze/">The Second Gaze</a> & <a href="../">Fairweather</a> - quietly relentless.
  </footer>

  <script>
    // Gallery data
    const galleryImages = [
      { src: 'images/Apple Blossom.webp', caption: 'Apple Blossom' },
      { src: 'images/Atrium2.png', caption: 'Atrium2' },
      { src: 'images/Birch.png', caption: 'Birch' },
      { src: 'images/BirchesWc.png', caption: 'BirchesWc' },
      { src: 'images/BirchMeadow.png', caption: 'Birch Meadow' },
      { src: 'images/BlueLandscape.png', caption: 'Blue Landscape' },
      { src: 'images/Chickadee.png', caption: 'Chickadee' },
      { src: 'images/EvenTheSmallestThings.png', caption: 'Even The Smallest Things' },
      { src: 'images/ForestDweller.webp', caption: 'Forest Dweller' },
      { src: 'images/GoldenInvitation.png', caption: 'Golden Invitation' },
      { src: 'images/IMG-3868.png', caption: 'Untitled Study' },
      { src: 'images/IMG-3869.png', caption: 'Untitled Study' },
      { src: 'images/IMG-3870.png', caption: 'Untitled Study' },
      { src: 'images/LaPuertaAzul.png', caption: 'La Puerta Azul' },
      { src: 'images/MoonlightDoctrine.png', caption: 'Moonlight Doctrine' },
      { src: 'images/MorningPrayer.png', caption: 'Morning Prayer' },
      { src: 'images/Nuthatch.png', caption: 'Nuthatch' },
      { src: 'images/PaintedLady.png', caption: 'Painted Lady' },
      { src: 'images/ShadowoftheMountain.png', caption: 'Shadow of the Mountain' },
      { src: 'images/Solitude.png', caption: 'Solitude' },
      { src: 'images/SummerStroll.png', caption: 'Summer Stroll' },
      { src: 'images/SunriseDoctrine.png', caption: 'Sunrise Doctrine' },
      { src: 'images/ThePaintedLady.png', caption: 'The Painted Lady' },
      { src: 'images/ThePokeWitch.png', caption: 'The Poke Witch' },
      { src: 'images/TwoChickadees.png', caption: 'Two Chickadees' },
      { src: 'images/Way Home.webp', caption: 'Way Home' },
      { src: 'images/WizardScreen.png', caption: 'Wizard Screen' },
      { src: 'images/YellowLandscape.png', caption: 'Yellow Landscape' },
    ];

    // Build gallery cards
    const gallery = document.getElementById('gallery');
    galleryImages.forEach(item => {
      const card = document.createElement('div');
      card.className = 'image-card';
      card.dataset.src = item.src;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-front">
            <div class="image-container">
              <img src="${item.src}" alt="${item.caption}" />
            </div>
            <div class="caption">${item.caption}</div>
          </div>
          <div class="card-face card-back">
            <div class="card-back-inner">${item.caption}</div>
          </div>
        </div>
      `;
      gallery.appendChild(card);
    });

    // Particle system
    const container = document.getElementById('particles');
    const colors = ['mist', 'steel', 'dust'];
    for (let i = 0; i < 40; i++) {
      const particle = document.createElement('div');
      const type = colors[Math.floor(Math.random() * colors.length)];
      particle.className = `particle ${type}`;
      let size;
      if (type === 'mist') size = Math.random() * 4 + 2;
      else if (type === 'steel') size = Math.random() * 3 + 1;
      else size = Math.random() * 2 + 1;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animation = `floatGentle ${Math.random() * 10 + 30}s linear ${Math.random() * 30}s infinite`;
      const peakOpacity = type === 'mist' ? 0.4 : type === 'steel' ? 0.3 : 0.25;
      particle.style.setProperty('--peak-opacity', peakOpacity);
      particle.style.setProperty('--drift', (Math.random() - 0.5) * 150 + 'px');
      container.appendChild(particle);
    }

    // Parallax
    let ticking = false;
    function updateParallax() {
      const scrolled = window.pageYOffset;
      document.querySelector('.mist-overlay-1').style.transform = `translateY(${scrolled * -0.2}px)`;
      document.querySelector('.mist-overlay-2').style.transform = `translateY(${scrolled * -0.35}px)`;
      document.querySelector('.mist-overlay-3').style.transform = `translateY(${scrolled * -0.5}px)`;
      ticking = false;
    }
    function requestTick() {
      if (!ticking) { requestAnimationFrame(updateParallax); ticking = true; }
    }
    window.addEventListener('scroll', requestTick);

    // Back to top
    const topButton = document.getElementById('scrollTop');
    window.addEventListener('scroll', () => {
      topButton.classList.toggle('show', window.scrollY > 300);
    });
    topButton.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Image loading
    document.querySelectorAll('.image-card img').forEach(img => {
      img.addEventListener('load', function() { this.classList.add('loaded'); });
      if (img.complete) img.classList.add('loaded');
    });

    // Mobile menu
    const mobileMenuButton = document.getElementById('mobileMenuButton');
    const navLinks = document.getElementById('navLinks');
    mobileMenuButton.addEventListener('click', () => {
      navLinks.classList.toggle('open');
      mobileMenuButton.textContent = navLinks.classList.contains('open') ? '✕ Close' : '☰ Menu';
    });
    navLinks.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') { navLinks.classList.remove('open'); mobileMenuButton.textContent = '☰ Menu'; }
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.nav')) { navLinks.classList.remove('open'); mobileMenuButton.textContent = '☰ Menu'; }
    });

    // Card entrance animations
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, index) => {
        if (entry.isIntersecting) {
          setTimeout(() => { entry.target.style.animation = 'fadeInUp 0.6s ease forwards'; }, index * 80);
        }
      });
    }, { threshold: 0.1, rootMargin: '50px' });
    document.querySelectorAll('.image-card').forEach(card => observer.observe(card));

    // ── Flip-to-lightbox system ──
    const overlay = document.getElementById('lightboxOverlay');
    const closeBtn = document.getElementById('lightboxClose');
    let activeCard = null;
    let activeClone = null;
    let isAnimating = false;

    function openLightbox(card) {
      if (isAnimating) return;
      isAnimating = true;
      activeCard = card;

      // Flip the card
      card.classList.add('flipping');

      // Get card position
      const rect = card.getBoundingClientRect();

      // After flip completes, create expanding clone
      setTimeout(() => {
        // Hide original card
        card.style.visibility = 'hidden';

        // Create clone that will expand
        const clone = document.createElement('div');
        clone.className = 'lightbox-card';
        clone.innerHTML = `<img src="${card.dataset.src}" alt="">`;
        clone.style.top = rect.top + 'px';
        clone.style.left = rect.left + 'px';
        clone.style.width = rect.width + 'px';
        clone.style.height = rect.height + 'px';
        document.body.appendChild(clone);
        activeClone = clone;

        // Show overlay
        overlay.style.display = 'block';
        document.body.style.overflow = 'hidden';

        // Expand to center after a frame
        requestAnimationFrame(() => {
          overlay.classList.add('active');

          // Calculate target size (90% of viewport, maintain aspect)
          const img = new Image();
          img.onload = function() {
            const vw = window.innerWidth * 0.9;
            const vh = window.innerHeight * 0.9;
            const imgRatio = this.naturalWidth / this.naturalHeight;
            let targetW, targetH;
            if (vw / vh > imgRatio) {
              targetH = vh;
              targetW = vh * imgRatio;
            } else {
              targetW = vw;
              targetH = vw / imgRatio;
            }
            const targetTop = (window.innerHeight - targetH) / 2;
            const targetLeft = (window.innerWidth - targetW) / 2;

            clone.style.top = targetTop + 'px';
            clone.style.left = targetLeft + 'px';
            clone.style.width = targetW + 'px';
            clone.style.height = targetH + 'px';
            clone.classList.add('expanded');

            // Show close button after expand
            setTimeout(() => {
              closeBtn.classList.add('visible');
              isAnimating = false;
            }, 800);
          };
          img.src = card.dataset.src;
        });
      }, 1000); // match flip duration
    }

    function closeLightbox() {
      if (isAnimating || !activeCard || !activeClone) return;
      isAnimating = true;

      closeBtn.classList.remove('visible');
      overlay.classList.remove('active');

      // Shrink clone back to card position
      const rect = activeCard.getBoundingClientRect();
      activeClone.style.top = rect.top + 'px';
      activeClone.style.left = rect.left + 'px';
      activeClone.style.width = rect.width + 'px';
      activeClone.style.height = rect.height + 'px';
      activeClone.classList.remove('expanded');

      // After shrink, remove clone and flip card back
      setTimeout(() => {
        activeClone.remove();
        activeClone = null;
        activeCard.style.visibility = 'visible';
        activeCard.classList.remove('flipping');
        overlay.style.display = 'none';
        document.body.style.overflow = 'auto';

        setTimeout(() => {
          isAnimating = false;
          activeCard = null;
        }, 1000);
      }, 800);
    }

    // Click handlers
    document.querySelectorAll('.image-card').forEach(card => {
      card.addEventListener('click', () => openLightbox(card));
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
